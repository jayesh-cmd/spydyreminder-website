    <!-- Live Counter Script -->
    <script>
        const namespace = 'SpydyReminderAppLive';
        const counterName = 'downloads';
        const counterElement = document.getElementById('download-counter');
        
        // Starting at 0 as requested!
        const BASELINE = 0; 
        
        // Bypassing CORS security blocks with a proxy (and cache-busting so it updates instantly)
        const cacheBuster = Date.now();
        const fetchUrl = 'https://corsproxy.io/?' + encodeURIComponent(`https://api.counterapi.dev/v1/${namespace}/${counterName}`) + '?cb=' + cacheBuster;
        const fetchUpUrl = 'https://corsproxy.io/?' + encodeURIComponent(`https://api.counterapi.dev/v1/${namespace}/${counterName}/up`) + '?cb=' + cacheBuster;

        // Fetch current count on load
        fetch(fetchUrl, { cache: 'no-store' })
            .then(res => res.json())
            .then(data => {
                const totalDownloads = BASELINE + data.count;
                counterElement.innerText = totalDownloads;
                // Log it to the Inspect console for the owner
                console.log(`%c🕵️‍♂️ SPYDY SECRET TRACKER: You have ${totalDownloads} total downloads!`, 'color: #22c55e; font-size: 14px; font-weight: bold;');
            })
            .catch(err => {
                counterElement.innerText = "Error";
            });

        // Function to increment counter when download is clicked
        function incrementCounter() {
            // First update locally
            const currentCount = parseInt(counterElement.innerText);
            if (!isNaN(currentCount)) {
                counterElement.innerText = currentCount + 1;
                console.log(`%c🎉 NEW DOWNLOAD! Total is now: ${currentCount + 1}`, 'color: #3b82f6; font-size: 12px; font-weight: bold;');
            }
            
            // Send increment request to global counter API
            fetch(fetchUpUrl, { cache: 'no-store' }).catch(err => console.error("Counter API error:", err));
        }
    </script>
